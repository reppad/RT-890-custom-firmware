on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: arm-none-eabi-gcc
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: '10.3-2021.10'

    - name: Checkout
      uses: actions/checkout@v4

    - name: Submodules
      run: git submodule update --init --recursive --depth 1

    - name: Make
      run:  make

    - name: size
      run:  arm-none-eabi-size firmware

    - name: Make multiboot
      run: |
        mv firmware.bin firmware.bin.default
        make clean
        make ENABLE_MULTIBOOT=1
        arm-none-eabi-size -A firmware | grep -E '^\.(text|fill|mb_ramfunc) '
        mv firmware.bin firmware-multiboot.bin
        mv firmware.bin.default firmware.bin

    - name: Multiboot host test
      run: |
        dpkg -s zlib1g-dev >/dev/null 2>&1 || (sudo apt-get update -q && sudo apt-get install -y zlib1g-dev)
        make -C tests/mb_host

    - name: 'Upload Artifact'
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: firmware*.bin
