# Restore RT-890 factory bootloader (AT32F421C8T7) via SWD
# Usage : openocd -f interface/stlink.cfg -f target/at32f421xx.cfg -f flash_bootloader.cfg
init
reset halt
flash write_image erase rt890_bootloader_0x08000000.bin 0x08000000 bin
verify_image rt890_bootloader_0x08000000.bin 0x08000000 bin
reset run
shutdown
